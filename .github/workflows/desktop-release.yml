# Builds the Mac and Windows apps from the native-desktop branch and attaches them to a release.
# Run it from the Actions tab (or: gh workflow run desktop-release.yml -f tag=v0.1.0).
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            built: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            name: JASSI-macos.dmg
          - os: windows-latest
            args: --bundles nsis
            built: target/release/bundle/nsis/*.exe
            name: JASSI-windows-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - run: cp ${{ matrix.built }} "${{ matrix.name }}"
      - run: gh release upload "$TAG" "${{ matrix.name }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
