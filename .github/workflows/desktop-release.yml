# Builds the Mac and Windows apps from the native-desktop branch and attaches them to a release.
# Run it from the Actions tab (or: gh workflow run desktop-release.yml -f tag=v0.1.0).
#
# Windows signing (free, via SignPath Foundation) switches on once these are set in
# Settings -> Secrets and variables -> Actions:
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
# Until then the Windows installer is built unsigned, as before.
# Each signing request needs approving on signpath.io while the job waits.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to
        required: true

permissions:
  contents: write
  actions: read

env:
  SIGN_WINDOWS: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            built: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            name: JASSI-macos.dmg
          - os: windows-latest
            args: --bundles nsis
            built: target/release/bundle/nsis/*.exe
            name: JASSI-windows-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Unsigned path: Mac always, Windows until SignPath is configured.
      - if: runner.os == 'macOS' || env.SIGN_WINDOWS != 'true'
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - if: runner.os == 'macOS' || env.SIGN_WINDOWS != 'true'
        run: cp ${{ matrix.built }} "${{ matrix.name }}"

      # Signed Windows path: sign the app exe, bundle the installer around it, then sign the installer.
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/target/release/jassi.exe
          archive: false
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        run: |
          cp ../../signed-app/jassi.exe target/release/jassi.exe
          npx --yes @tauri-apps/cli@2 bundle --bundles nsis
          cp target/release/bundle/nsis/*.exe ../../unsigned-setup.exe
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        id: upload-setup
        uses: actions/upload-artifact@v7
        with:
          path: unsigned-setup.exe
          archive: false
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        run: cp ../../signed-setup/unsigned-setup.exe "${{ matrix.name }}"

      - run: gh release upload "$TAG" "${{ matrix.name }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
