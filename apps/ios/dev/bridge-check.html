<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.S.S.I bridge check</title>
<style>
  body { margin: 0; padding: 12px; background: #01060c; color: #d8f6ff; font: 13px/1.35 -apple-system, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 6px; color: #3ce8ff; }
  h2 { font-size: 12px; margin: 12px 0 4px; color: #3ce8ff; text-transform: uppercase; letter-spacing: .08em; }
  button { background: #3ce8ff; color: #01060c; border: 0; border-radius: 6px; padding: 7px 9px; margin: 0 4px 6px 0; font: 600 12px -apple-system, sans-serif; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11px/1.35 ui-monospace, Menlo, monospace; }
  .ok { color: #4dffb0; } .no { color: #ffb84d; }
</style>
</head>
<body>
<h1>J.A.S.S.I bridge check</h1>
<pre id="about"></pre>

<h2>Needs a tap</h2>
<div id="buttons"></div>

<h2>Events from the app</h2>
<pre id="events">(none yet)</pre>

<h2>Calls and results</h2>
<pre id="log"></pre>

<script>
// A throwaway page for testing the iPhone shell. It calls every method of window.jassiNative
// and shows what came back. Serve it with stub_server.py and point JASSI_URL at it.
var native = window.jassiNative;
var log = document.getElementById("log");
var events = document.getElementById("events");
var seen = 0;

function show(call, result) {
  var good = result && result.ok !== false;
  log.innerHTML += '<span class="' + (good ? "ok" : "no") + '">' + call + "</span>\n  → " +
    JSON.stringify(result).replace(/</g, "&lt;") + "\n";
}

function run(name, args, label) {
  var call = name + "(" + (args === undefined ? "" : JSON.stringify(args)) + ")";
  if (!native || typeof native[name] !== "function") { show(call, { ok: false, error: "missing method" }); return Promise.resolve(); }
  return native[name](args).then(function (r) { show(label || call, r); }, function (e) { show(call, { ok: false, error: "REJECTED " + e }); });
}

window.addEventListener("jassi-native", function (e) {
  seen += 1;
  events.textContent = (seen === 1 ? "" : events.textContent) + seen + ". " + JSON.stringify(e.detail) + "\n";
});

document.getElementById("about").textContent = native
  ? "window.jassiNative: platform=" + native.platform + " version=" + native.version + " contract=" + native.contract
  : "window.jassiNative is MISSING (this page is not running inside the app, or not on the JASSI_URL origin)";

var query = new URLSearchParams(location.search);

// Inside a frame the bridge must not exist, and the app must refuse a direct message.
if (window.top !== window) {
  document.body.innerHTML = '<pre id="log"></pre>';
  log = document.getElementById("log");
  log.textContent = "INSIDE A FRAME: typeof window.jassiNative = " + typeof window.jassiNative + "\n";
  var direct = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jassi;
  (direct ? direct.postMessage({ method: "listApps", args: null }) : Promise.reject(new Error("no handler")))
    .then(function (r) { show("FRAME: direct message was ANSWERED (wrong)", r); },
          function (e) { show("FRAME: direct message refused (right)", { ok: false, error: e.message }); });
  throw new Error("in a frame: nothing more to do");
}
if (query.get("frame")) {
  var frame = document.createElement("iframe");
  frame.src = "/frame";
  frame.style.cssText = "width:100%;height:110px;border:1px solid #3ce8ff;margin-top:10px";
  document.body.appendChild(frame);
}

// [label, method, argument, short name for ?run=]
var taps = [
  ["Ask: mic", "openPermission", "mic", "mic"],
  ["Ask: speech", "openPermission", "speech", "speech"],
  ["Ask: alerts", "openPermission", "notifications", "alerts"],
  ["Permissions", "permissions", undefined, "permissions"],
  ["Face ID", "biometric", { reason: "Confirm it's you" }, "faceid"],
  ["Speak", "speak", { text: "Hello, I am Jassi.", lang: "en-IN" }, "speak"],
  ["Stop speaking", "speakStop", undefined, "speakstop"],
  ["Listen", "listenStart", { lang: "en-IN" }, "listen"],
  ["Stop listening", "listenStop", undefined, "listenstop"],
  ["Alert", "notify", { title: "J.A.S.S.I", body: "This is a test alert." }, "alert"],
  ["Sign in", "openExternal", location.origin + "/auth/google/start?app=test", "signin"],
  ["Open a site", "openExternal", "https://example.com/", "site"],
  ["List apps", "listApps", undefined, "apps"],
  ["Listen on device", "listenStart", { lang: "en-IN", onDevice: true }, "listendevice"],
  ["Bubble: asleep", "bubble", { visible: true, state: "sleep", text: "" }, "sleep"],
  ["Bubble: listening", "bubble", { visible: true, state: "listening", text: "pay Asha five hundred rupees", who: "you" }, "listening"],
  ["Bubble: thinking", "bubble", { visible: true, state: "thinking", text: "pay Asha five hundred rupees", who: "you" }, "thinking"],
  ["Bubble: speaking", "bubble", { visible: true, state: "speaking", text: "Sent 500 rupees to Asha. Anything else?", who: "jassi" }, "speaking"],
  ["Bubble: hide", "bubble", { visible: false }, "hide"],
];
taps.forEach(function (t) {
  var b = document.createElement("button");
  b.textContent = t[0];
  b.onclick = function () { run(t[1], t[2]); };
  document.getElementById("buttons").appendChild(b);
});

// Not a bridge call: an ordinary link to another site. The app must hand it to Safari and stay on this page.
var link = document.createElement("button");
link.textContent = "Follow a link";
link.onclick = function () { location.href = "https://example.com/"; };
document.getElementById("buttons").appendChild(link);
if (query.get("link")) setTimeout(link.onclick, 1500);

// Not a bridge call: the page itself going to a jassi://auth link. The app must turn it into an `auth` event.
var deep = document.createElement("button");
deep.textContent = "Go to jassi://auth";
deep.onclick = function () { location.href = "jassi://auth?code=test"; };
document.getElementById("buttons").appendChild(deep);
if (query.get("deeplink")) setTimeout(deep.onclick, 1500);

// "?run=speak,alert" presses those buttons for you, in order, after the automatic calls below.
var wanted = (query.get("run") || "").split(",").filter(Boolean).map(function (name) {
  var t = taps.filter(function (t) { return t[3] === name; })[0];
  return t ? [t[1], t[2]] : null;
}).filter(Boolean);

// "?only=1" skips the automatic calls.
// The calls that need no tap run by themselves, one after another.
(query.get("only") ? [] : [
  ["permissions"],
  ["listApps"],
  ["openPermission", "screen"],
  ["pair", { server: location.origin, deviceId: "test-device", token: "test-token" }],
  ["unpair"],
  ["setPolicy", { blockedApps: ["com.example.bank"] }],
  ["stop"],
  ["speakStop"],
  ["listenStop"],
  ["notify", { title: "J.A.S.S.I", body: "Sent before alerts were allowed." }],
  ["openExternal", "file:///etc/passwd"],
  ["speak", {}],
]).concat(wanted).reduce(function (chain, c) { return chain.then(function () { return run(c[0], c[1]); }); }, Promise.resolve());
</script>
</body>
</html>
