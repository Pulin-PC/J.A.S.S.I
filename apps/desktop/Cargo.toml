[package]
name = "jassi-desktop"
version = "0.1.0"
edition = "2021"
description = "J.A.S.S.I for macOS and Windows: a thin shell around the web app (docs/native-contract.md)"
license = "MIT"
publish = false

[[bin]]
name = "jassi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = "5"
# native-tls = the OS's own TLS (Secure Transport / SChannel): nothing to cross-compile for Windows.
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
plist = "1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"
objc2-local-authentication = "0.3"
objc2-avf-audio = "0.3"
objc2-av-foundation = "0.3"
objc2-speech = "0.3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "2"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechRecognition",
    "Media_SpeechSynthesis",
    "Security_Credentials_UI",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
